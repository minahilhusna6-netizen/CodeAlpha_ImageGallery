<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Beautiful Gallery</h1>

    <!-- This is the grid where your small images will appear -->
    <div class="gallery">
        <img src="images/1.jpg" alt="Image 1" onclick="openLightbox(0)">
        <img src="images/2.jpg" alt="Image 2" onclick="openLightbox(1)">
        <img src="images/3.jpg" alt="Image 3" onclick="openLightbox(2)">
        <img src="images/4.jpg" alt="Image 4" onclick="openLightbox(3)">
        <img src="images/5.jpg" alt="Image 5" onclick="openLightbox(4)">
        <img src="images/6.jpg" alt="Image 6" onclick="openLightbox(5)">
    </div>

    <!-- This is the Lightbox (the pop-up that appears when you click an image) -->
    <div id="lightbox" class="lightbox">
        <span class="close" onclick="closeLightbox()">&times;</span>
        
        <!-- Left and Right arrows for Next/Prev -->
        <button class="prev" onclick="changeImage(-1)">&#10094;</button>
        
        <!-- The big image that shows up -->
        <img id="lightbox-img" src="" alt="Big Image">
        
        <button class="next" onclick="changeImage(1)">&#10095;</button>
    </div>

    <!-- This connects your JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
